<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ArtikWordle</title>
    <style>
        body { background: #121213; color: white; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; margin: 0; padding: 10px; }
        .header-ui { position: absolute; top: 10px; width: calc(100% - 20px); display: flex; justify-content: space-between; }
        .user-card { text-align: left; }
        .rank-text { color: #854ce6; font-weight: bold; font-size: 12px; }
        .xp-container { width: 100px; height: 4px; background: #3a3a3c; margin-top: 4px; }
        .xp-bar { height: 100%; background: #854ce6; width: 0%; }
        
        .game-title { font-size: 2.5rem; font-weight: bold; margin-top: 80px; margin-bottom: 40px; }
        
        /* Меню и контейнеры */
        .menu-container { display: flex; flex-direction: column; gap: 15px; width: 300px; }
        .hidden { display: none !important; }
        
        button { 
            padding: 15px; border-radius: 8px; border: none; font-size: 18px; font-weight: bold; 
            cursor: pointer; color: white; transition: 0.2s;
        }
        .btn-main { background: #538d4e; }
        .btn-multi { background: #854ce6; }
        .btn-back { background: transparent; border: 1px solid #3a3a3c; color: #818384; margin-top: 10px; }
        
        input { 
            padding: 15px; background: #1a1a1b; border: 2px solid #3a3a3c; 
            color: white; border-radius: 8px; text-align: center; font-size: 18px;
        }

        /* Сетка как на фото */
        .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; margin: 20px 0; }
        .cell { width: 55px; height: 55px; border: 2px solid #3a3a3c; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; font-weight: bold; }
    </style>
</head>
<body>
    <div class="header-ui">
        <div class="user-card">
            <div id="player-name">Player ✏️</div>
            <div class="rank-text" id="player-rank">SILVER I</div>
            <div class="xp-container"><div class="xp-bar" id="xp-bar"></div></div>
        </div>
        <div id="online-count">Онлайн: 0</div>
    </div>

    <div class="game-title">ArtikWordle</div>

    <div id="menu-root" class="menu-container">
        <button class="btn-main" onclick="showScreen('menu-offline')">ОФЛАЙН</button>
        <button class="btn-multi" onclick="showScreen('menu-multiplayer')">МУЛЬТИПЛЕЕР</button>
    </div>

    <div id="menu-offline" class="menu-container hidden">
        <button class="btn-main" onclick="startSolo()">ОДИНОЧНАЯ ИГРА</button>
        <button class="btn-main" style="background: #b59f3b;" onclick="startBot()">СРАЖЕНИЕ С БОТОМ</button>
        <button class="btn-back" onclick="showScreen('menu-root')">НАЗАД</button>
    </div>

    <div id="menu-multiplayer" class="menu-container hidden">
        <button class="btn-multi" onclick="createRoom()">СОЗДАТЬ КОМНАТУ</button>
        <div style="display:flex; flex-direction:column; gap:10px; margin-top:10px;">
            <input type="text" id="room-code-input" placeholder="Код (6 знаков)" maxlength="6" oninput="toggleJoinBtn()">
            <button id="join-btn" class="btn-main hidden" onclick="joinRoom()">ПОДКЛЮЧИТЬСЯ</button>
        </div>
        <button class="btn-back" onclick="showScreen('menu-root')">НАЗАД</button>
    </div>

    <div id="game-zone" class="hidden" style="text-align:center;">
        <h3 id="game-status">ОТГАДЫВАЙТЕ!</h3>
        <div class="grid" id="board"></div>
        <button class="btn-back" onclick="location.reload()">В ГЛАВНОЕ МЕНЮ</button>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="script.js"></script>
</body>
</html>
