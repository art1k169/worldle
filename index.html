<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ArtikWordle Competitive</title>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        :root {
            --bg: #ffffff; --text: #1a1a1b; --border: #d3d6da;
            --tile-bg: #ffffff; --correct: #6aaa64; --present: #c9b458; 
            --absent: #787c7e; --header-border: #d3d6da; --accent: #7c3aed;
        }
        [data-theme="dark"] {
            --bg: #121213; --text: #ffffff; --border: #3a3a3c;
            --tile-bg: #121213; --header-border: #3a3a3c;
        }
        body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; margin: 0; display: flex; flex-direction: column; align-items: center; transition: 0.3s; min-height: 100vh; }
        
        header { width: 100%; border-bottom: 1px solid var(--header-border); padding: 15px 0; text-align: center; position: relative; }
        .theme-toggle { position: absolute; right: 20px; top: 50%; transform: translateY(-50%); cursor: pointer; font-size: 20px; user-select: none; }
        
        .user-card { position: absolute; left: 20px; top: 50%; transform: translateY(-50%); text-align: left; width: 180px; }
        .nick-container { display: flex; align-items: center; gap: 5px; margin-bottom: 2px; }
        #stat-nick { font-size: 14px; font-weight: bold; max-width: 120px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .edit-icon { cursor: pointer; font-size: 12px; opacity: 0.6; transition: 0.2s; }
        .edit-icon:hover { opacity: 1; color: var(--accent); }
        
        .rank-name { font-weight: bold; font-size: 11px; text-transform: uppercase; color: var(--accent); letter-spacing: 0.5px; }
        .xp-container { width: 100%; height: 6px; background: var(--border); border-radius: 3px; margin-top: 4px; overflow: hidden; }
        #xp-bar { height: 100%; width: 0%; background: var(--accent); transition: 1s ease-out; }

        .screen { display: none; width: 100%; max-width: 400px; flex-direction: column; align-items: center; padding-top: 60px; animation: fadeIn 0.4s; }
        .active { display: flex; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes pop { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }

        input { padding: 15px; border: 2px solid var(--border); border-radius: 10px; width: 85%; font-size: 16px; margin-bottom: 12px; background: transparent; color: var(--text); outline: none; }
        button { padding: 16px; width: 92%; background: var(--accent); color: white; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; text-transform: uppercase; margin-bottom: 10px; transition: 0.2s; }
        button:hover { filter: brightness(1.1); transform: translateY(-1px); }
        .secondary-btn { background: var(--absent); }

        #board { display: grid; gap: 8px; margin: 20px 0; }
        .row { display: flex; gap: 8px; }
        .tile { width: 55px; height: 55px; border: 2px solid var(--border); display: flex; justify-content: center; align-items: center; font-size: 28px; font-weight: bold; text-transform: uppercase; background: var(--tile-bg); transition: 0.3s; color: var(--text); }
        .tile.filled { border-color: var(--absent); animation: pop 0.1s; }
        
        .correct { background: var(--correct) !important; border-color: var(--correct) !important; color: white !important; }
        .present { background: var(--present) !important; border-color: var(--present) !important; color: white !important; }
        .absent { background: var(--absent) !important; border-color: var(--absent) !important; color: white !important; }
        .flip { transform: rotateX(90deg); }

        .player-badge { background: var(--border); padding: 10px 15px; border-radius: 12px; margin: 5px; width: 85%; display: flex; justify-content: space-between; font-size: 14px; color: var(--text); }
    </style>
</head>
<body data-theme="light">

    <header>
        <div class="user-card">
            <div class="nick-container">
                <span id="stat-nick">Player</span>
                <span class="edit-icon" onclick="editNick()">✏️</span>
            </div>
            <div id="rank-name" class="rank-name">Silver I</div>
            <div class="xp-container"><div id="xp-bar"></div></div>
        </div>
        <h2 style="margin:0; letter-spacing: 3px;">ArtikWordle</h2>
        <div class="theme-toggle" onclick="toggleTheme()">🌙</div>
    </header>

    <div id="sc-auth" class="screen active">
        <button onclick="create()">Создать комнату</button>
        <div style="margin: 15px; font-weight: bold; opacity: 0.3;">ИЛИ</div>
        <input type="text" id="code-in" placeholder="Введите код комнаты" autocomplete="off">
        <button class="secondary-btn" onclick="join()">Присоединиться</button>
    </div>

    <div id="sc-lobby" class="screen">
        <div id="r-code" style="font-size: 36px; font-weight: 900; color: var(--accent); margin-bottom: 25px; letter-spacing: 2px;">------</div>
        <div id="players-list" style="width: 100%; display: flex; flex-direction: column; align-items: center;">
            <div class="player-badge"><span>👤 Игрок 1</span><span id="p1">...</span></div>
            <div class="player-badge"><span>👤 Игрок 2</span><span id="p2">Ожидание...</span></div>
        </div>
        <button id="start-btn" style="display:none; margin-top: 30px;" onclick="start()">Начать игру</button>
        <button class="secondary-btn" style="margin-top: 10px;" onclick="location.reload()">Выйти</button>
    </div>

    <div id="sc-game" class="screen">
        <div id="game-status" style="margin-bottom: 20px; font-weight: bold; text-transform: uppercase;">Ожидание...</div>
        <div id="m-area" style="display:none; width:100%; text-align:center">
            <input type="text" id="s-word" maxlength="5" placeholder="Слово из 5 букв">
            <button onclick="sendS()">Загадать</button>
        </div>
        <div id="board"></div>
        <div id="post-game" style="display:none; width:92%">
            <button onclick="location.reload()">В главное меню</button>
        </div>
    </div>

    <script>
        const socket = io("https://worldle-rcee.onrender.com");
        let curRoom = "", myRole = "", curRow = 0, curTile = 0, gameActive = false;

        const RANKS = ["Silver I", "Silver Elite", "Gold Nova I", "Gold Nova Master", "Master Guardian", "Global Elite"];
        let stats = JSON.parse(localStorage.getItem('artikStats')) || { name: 'Player', score: 0, theme: 'light' };

        function updateUI() {
            document.getElementById('stat-nick').innerText = stats.name;
            const rankIdx = Math.min(Math.floor(stats.score / 1000), RANKS.length - 1);
            const xpPercent = (stats.score % 1000) / 10;
            
            document.getElementById('rank-name').innerText = RANKS[rankIdx];
            document.getElementById('xp-bar').style.width = xpPercent + "%";
            document.body.setAttribute('data-theme', stats.theme);
            document.querySelector('.theme-toggle').innerText = stats.theme === 'light' ? '🌙' : '☀️';
            localStorage.setItem('artikStats', JSON.stringify(stats));
        }
        updateUI();

        function editNick() {
            const newNick = prompt("Введите новый никнейм:", stats.name);
            if (newNick && newNick.trim().length > 0) {
                stats.name = newNick.trim().substring(0, 12);
                updateUI();
            }
        }

        function toggleTheme() {
            stats.theme = stats.theme === 'light' ? 'dark' : 'light';
            updateUI();
        }

        function show(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        function create() { 
            socket.emit('createRoom', { name: stats.name }); 
        }
        
        function join() {
            const codeInput = document.getElementById('code-in').value.toUpperCase();
            if(codeInput.length < 1) return alert("Введите код!");
            curRoom = codeInput;
            socket.emit('joinRoom', { code: curRoom, name: stats.name });
            show('sc-lobby');
            document.getElementById('r-code').innerText = curRoom;
        }

        function start() { 
            socket.emit('startGame', curRoom); 
        }

        socket.on('roomCreated', d => {
            curRoom = d.code;
            document.getElementById('r-code').innerText = d.code;
            document.getElementById('start-btn').style.display = 'block';
            show('sc-lobby');
        });

        socket.on('playerJoined', ps => {
            document.getElementById('p1').innerText = ps[0]?.name || "...";
            document.getElementById('p2').innerText = ps[1]?.name || "Ожидание...";
        });

        socket.on('initRole', d => {
            myRole = d.role; show('sc-game');
            document.getElementById('game-status').innerText = myRole === 'master' ? "Загадайте слово" : "Ожидание слова...";
            document.getElementById('m-area').style.display = myRole === 'master' ? 'block' : 'none';
            initBoard();
        });

        function sendS() {
            const w = document.getElementById('s-word').value.toUpperCase();
            if(w.length === 5) {
                socket.emit('setSecretWord', { code: curRoom, word: w });
                document.getElementById('m-area').style.display = 'none';
                document.getElementById('game-status').innerText = "Оппонент отгадывает";
            }
        }

        socket.on('wordIsReady', () => {
            if(myRole === 'guesser') {
                gameActive = true;
                document.getElementById('game-status').innerText = "Ваш ход!";
                window.addEventListener('keydown', handleInput);
            }
        });

        function initBoard() {
            const b = document.getElementById('board'); b.innerHTML = '';
            for(let i=0; i<6; i++) {
                const r = document.createElement('div'); r.className = 'row';
                for(let j=0; j<5; j++) {
                    const t = document.createElement('div'); t.className = 'tile'; t.id = `t-${i}-${j}`; r.appendChild(t);
                }
                b.appendChild(r);
            }
        }

        function handleInput(e) {
            if(!gameActive) return;
            const tile = document.getElementById(`t-${curRow}-${curTile}`);
            if(e.key === 'Enter' && curTile === 5) {
                let guess = "";
                for(let i=0; i<5; i++) guess += document.getElementById(`t-${curRow}-${i}`).innerText;
                socket.emit('submitGuess', { code: curRoom, guess });
                gameActive = false;
            } else if(e.key === 'Backspace' && curTile > 0) {
                curTile--;
                const t = document.getElementById(`t-${curRow}-${curTile}`);
                t.innerText = ""; t.classList.remove('filled');
            } else if(curTile < 5 && e.key.length === 1 && /[а-яА-ЯёЁa-zA-Z]/.test(e.key)) {
                tile.innerText = e.key.toUpperCase();
                tile.classList.add('filled');
                curTile++;
            }
        }

        socket.on('guessResult', d => {
            d.states.forEach((s, i) => {
                setTimeout(() => {
                    const t = document.getElementById(`t-${curRow}-${i}`);
                    t.classList.add('flip');
                    setTimeout(() => { t.classList.add(s); t.classList.remove('flip'); }, 200);
                }, i * 150);
            });

            setTimeout(() => {
                if(d.isWin) {
                    document.getElementById('game-status').innerText = "Победа! +150 XP";
                    if(myRole === 'guesser' && socket.id === d.senderId) { stats.score += 150; updateUI(); }
                    document.getElementById('post-game').style.display = 'block';
                } else if(curRow >= 5) {
                    document.getElementById('game-status').innerText = "Поражение";
                    document.getElementById('post-game').style.display = 'block';
                } else {
                    curRow++; curTile = 0; if(myRole === 'guesser') gameActive = true;
                }
            }, 1200);
        });
    </script>
</body>
</html>
