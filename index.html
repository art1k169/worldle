<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ArtikWordle</title>
    <style>
        body { background: #121213; color: white; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; margin: 0; padding: 20px; }
        .user-stats { position: absolute; top: 10px; left: 10px; text-align: left; }
        .rank { color: #854ce6; font-weight: bold; font-size: 12px; }
        #online-counter { position: absolute; top: 10px; right: 10px; color: #818384; font-size: 14px; }
        h1 { margin-top: 40px; }
        #xp-container { width: 100px; height: 4px; background: #3a3a3c; margin-top: 4px; border-radius: 2px; }
        #xp-bar { width: 0%; height: 100%; background: #854ce6; border-radius: 2px; }
        #game-container { text-align: center; margin-top: 20px; }
        .grid { display: grid; grid-template-rows: repeat(6, 1fr); grid-template-columns: repeat(5, 1fr); gap: 5px; margin-bottom: 20px; }
        .cell { width: 60px; height: 60px; border: 2px solid #3a3a3c; display: flex; align-items: center; justify-content: center; font-size: 2rem; font-weight: bold; text-transform: uppercase; }
        #keyboard { max-width: 500px; }
        .key-row { display: flex; justify-content: center; margin-bottom: 8px; gap: 6px; }
        button.key { background: #818384; color: white; border: none; padding: 15px 10px; border-radius: 4px; cursor: pointer; font-weight: bold; min-width: 30px; }
        button.enter { min-width: 65px; background: #538d4e; }
        button.backspace { min-width: 65px; }
    </style>
</head>
<body>
    <div class="user-stats">
        <div id="player-name-display">Player ✏️</div>
        <div class="rank" id="player-rank">SILVER I</div>
        <div id="xp-container">
            <div id="xp-bar"></div>
        </div>
    </div>

    <div id="online-counter">Онлайн: 0</div>

    <h1>ArtikWordle</h1>

    <div id="game-container">
        <div id="status-msg" style="margin-bottom: 10px; height: 1.2em;"></div>
        <div class="grid" id="board">
            </div>

        <div id="keyboard">
            </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="script.js"></script>
</body>
</html>
