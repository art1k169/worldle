<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ArtikWordle Multiplayer</title>
    <link rel="stylesheet" href="style.css"> </head>
<body>
    <div id="app">
        <header>
            <h1>ArtikWordle</h1>
            <div id="online-counter">Онлайн: 0</div>
        </header>

        <div id="lobby-menu">
            <h2>Публичные лобби</h2>
            <div id="rooms-list" style="border: 1px solid #ccc; min-height: 100px; margin-bottom: 10px;">
                </div>
            <button onclick="createNewLobby()">Создать лобби</button>
        </div>

        <hr>

        <div id="game-zone" style="display:none;">
            <h2 id="status-msg">Ожидание начала...</h2>
            
            <div id="wordle-grid">
                </div>

            <div id="chat-container" style="margin-top: 20px; border: 1px solid #555; padding: 10px;">
                <div id="chat-messages" style="height: 150px; overflow-y: auto; background: #f9f9f9; color: #000;"></div>
                <input type="text" id="chat-input" placeholder="Введите сообщение...">
                <button onclick="sendChatMessage()">Отправить</button>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="script.js"></script>
</body>
</html>
