<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ArtikWordle vs BOT</title>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        :root { --bg: #121213; --text: #ffffff; --border: #3a3a3c; --correct: #6aaa64; --present: #c9b458; --absent: #787c7e; --key: #818384; --accent: #7c3aed; }
        body { background: var(--bg); color: var(--text); font-family: sans-serif; display: flex; flex-direction: column; align-items: center; margin: 0; min-height: 100vh; overflow: hidden; }
        
        #user-card { position: absolute; top: 10px; left: 10px; background: rgba(255,255,255,0.05); padding: 10px; border-radius: 8px; border-left: 3px solid var(--accent); min-width: 120px; z-index: 10; }
        #u-name { font-weight: bold; font-size: 14px; margin-bottom: 2px; }
        #u-rank { font-size: 11px; color: var(--accent); font-weight: 800; }
        #u-xp { font-size: 10px; opacity: 0.6; }

        header { width: 100%; border-bottom: 1px solid var(--border); padding: 15px 0; text-align: center; margin-bottom: 20px; }
        .screen { display: none; width: 100%; max-width: 500px; flex-direction: column; align-items: center; }
        .active { display: flex; }
        
        /* Layout для игры с ботом */
        #game-container { display: flex; gap: 20px; justify-content: center; align-items: flex-start; margin-bottom: 20px; }
        
        #board { display: grid; gap: 5px; }
        .row { display: flex; gap: 5px; }
        .tile { width: 52px; height: 52px; border: 2px solid var(--border); display: flex; justify-content: center; align-items: center; font-size: 26px; font-weight: bold; text-transform: uppercase; transition: 0.2s; }
        
        /* Мини-поле бота */
        #bot-area { display: none; flex-direction: column; align-items: center; }
        #bot-title { font-size: 12px; font-weight: bold; margin-bottom: 5px; color: var(--accent); }
        #bot-board { display: grid; gap: 3px; }
        .bot-row { display: flex; gap: 3px; }
        .bot-tile { width: 26px; height: 26px; border: 1px solid var(--border); display: flex; justify-content: center; align-items: center; font-size: 14px; font-weight: bold; text-transform: uppercase; }

        #keyboard { display: flex; flex-direction: column; gap: 8px; width: 100%; max-width: 480px; padding: 10px; box-sizing: border-box; }
        .k-row { display: flex; justify-content: center; gap: 4px; }
        .key { background: var(--key); color: white; border: none; height: 58px; border-radius: 4px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; text-transform: uppercase; flex: 1; font-size: 14px; }
        .key.wide { flex: 1.5; font-size: 18px; }
        
        .correct { background: var(--correct) !important; border-color: var(--correct); }
        .present { background: var(--present) !important; border-color: var(--present); }
        .absent { background: var(--absent) !important; border-color: var(--absent); }

        button.main-btn { padding: 15px; width: 85%; background: var(--accent); color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin: 5px 0; font-size: 16px; }
        input { padding: 15px; width: 80%; margin-bottom: 10px; border: 2px solid var(--border); border-radius: 8px; background: #272729; color: white; text-align: center; font-size: 18px; }

        #toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: #ef4444; color: white; padding: 10px 20px; border-radius: 8px; font-weight: bold; opacity: 0; pointer-events: none; transition: 0.3s; z-index: 1000; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        #toast.show { opacity: 1; }
    </style>
</head>
<body>
    <div id="toast">Слова нет в словаре!</div>

    <div id="user-card">
        <div id="u-name">Загрузка...</div>
        <div id="u-rank">SILVER I</div>
        <div id="u-xp">XP: 0 / 1000</div>
    </div>

    <header><h2>ArtikWordle</h2></header>

    <div id="sc-auth" class="screen active">
        <input type="text" id="nick-in" placeholder="Ваш никнейм" maxlength="12">
        <button class="main-btn" onclick="saveNick()">Сохранить ник</button>
        <div style="margin:10px; opacity:0.3">———</div>
        <button class="main-btn" onclick="startSolo()">Одиночный режим</button>
        <button class="main-btn" style="background:#f59e0b" onclick="startBotMatch()">Играть с БОТОМ</button>
        <div style="margin:10px; opacity:0.3">———</div>
        <button class="main-btn" style="background:#444" onclick="create()">Создать комнату</button>
        <input type="text" id="code-in" placeholder="Код лобби">
        <button class="main-btn" style="background:#333" onclick="join()">Войти по коду</button>
    </div>

    <div id="sc-lobby" class="screen">
        <h1 id="r-code" style="color:var(--accent); font-size: 45px; letter-spacing: 5px;">------</h1>
        <div id="p-list" style="margin-bottom: 20px;">Ожидание...</div>
        <button id="start-btn" class="main-btn" style="display:none" onclick="socket.emit('startGame', curRoom)">Начать игру</button>
        <button class="main-btn" style="background:#ef4444" onclick="location.reload()">Выйти</button>
    </div>

    <div id="sc-game" class="screen">
        <div id="game-status" style="margin-bottom: 15px; font-weight: bold; color: var(--accent); height: 20px;"></div>
        
        <div id="game-container">
            <div id="board"></div>
            
            <div id="bot-area">

        <div id="keyboard"></div>
        <button id="back-btn" class="main-btn" style="display:none; margin-top: 10px;" onclick="location.reload()">В главное меню</button>
    </div>

        const DICTIONARY = DICT_STR.split(',');

        const socket = io("https://worldle-rcee.onrender.com");
        let curRoom = "", myRole = "", curRow = 0, curTile = 0, gameActive = false, secretWord = "";
        let botMode = false, botInterval, botRow = 0, botWords = [];
        
        const RANKS = ["SILVER I", "SILVER II", "GOLD I", "GOLD II", "PLATINUM", "DIAMOND", "MASTER"];
        let myXP = parseInt(localStorage.getItem('wordleXP')) || 0;
        let myNick = localStorage.getItem('wordleNick') || "Игрок";

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.innerText = msg;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 2000);
        }

        function updateUI() {
            document.getElementById('u-name').innerText = myNick;
            let rankIdx = Math.floor(myXP / 1000);
            if (rankIdx > RANKS.length - 1) rankIdx = RANKS.length - 1;
            document.getElementById('u-rank').innerText = RANKS[rankIdx];
            document.getElementById('u-xp').innerText = `XP: ${myXP % 1000} / 1000`;
            localStorage.setItem('wordleXP', myXP);
        }
        updateUI();

        function saveNick() {
            const val = document.getElementById('nick-in').value;
            if(val) { myNick = val; localStorage.setItem('wordleNick', val); updateUI(); }
        }

        // --- КОМНАТЫ ---
        function create() { socket.emit('createRoom', { name: myNick }); }
        function join() { 
            curRoom = document.getElementById('code-in').value.toUpperCase(); 
            if(curRoom) { socket.emit('joinRoom', { code: curRoom, name: myNick }); show('sc-lobby'); }
        }

        socket.on('roomCreated', d => { 
            curRoom = d.code; document.getElementById('r-code').innerText = d.code; 
            document.getElementById('start-btn').style.display = 'block'; show('sc-lobby'); 
        });

        socket.on('playerJoined', ps => { 
            document.getElementById('p-list').innerText = ps.length > 1 ? "Соперник подключился" : "Ожидание..."; 
        });

        socket.on('roomClosed', () => { location.reload(); });

        socket.on('initRole', d => {
            myRole = d.role; botMode = false; show('sc-game');
            resetGameState();
            if(myRole === 'master') {
                document.getElementById('game-status').innerText = "ЗАГАДАЙТЕ СЛОВО";
                gameActive = true;
            } else {
                document.getElementById('game-status').innerText = "ОППОНЕНТ ЗАГАДЫВАЕТ...";
            }
        });

        // --- РЕЖИМЫ ИГРЫ ---
        function startSolo() {
            curRoom = ""; botMode = false; myRole = 'guesser'; 
            secretWord = DICTIONARY[Math.floor(Math.random() * DICTIONARY.length)];
            show('sc-game'); resetGameState();
            gameActive = true;
            document.getElementById('game-status').innerText = "ОДИНОЧНЫЙ РЕЖИМ";
        }

        function startBotMatch() {
            curRoom = ""; botMode = true; myRole = 'guesser'; 
            secretWord = DICTIONARY[Math.floor(Math.random() * DICTIONARY.length)];
            show('sc-game'); resetGameState();
            
            // Настройка бота
            document.getElementById('bot-area').style.display = 'flex';
            botRow = 0;
            botWords = [...DICTIONARY];
            gameActive = true;
            document.getElementById('game-status').innerText = "СОРЕВНОВАНИЕ С БОТОМ!";
            
            clearInterval(botInterval);
            botInterval = setInterval(botTurn, 3500); // Бот ходит каждые 3.5 сек
        }

        function resetGameState() {
            curRow = 0; curTile = 0;
            document.getElementById('bot-area').style.display = 'none';
            document.getElementById('back-btn').style.display = 'none';
            clearInterval(botInterval);
            initBoard('board', 't'); initBoard('bot-board', 'bt'); initKeyboard();
        }

        function initBoard(containerId, prefix) {
            const b = document.getElementById(containerId); b.innerHTML = '';
            const rowClass = prefix === 't' ? 'row' : 'bot-row';
            const tileClass = prefix === 't' ? 'tile' : 'bot-tile';
            for(let i=0; i<6; i++) {
                const r = document.createElement('div'); r.className = rowClass;
                for(let j=0; j<5; j++) {
                    const t = document.createElement('div'); t.className = tileClass; t.id = `${prefix}-${i}-${j}`; r.appendChild(t);
                }
                b.appendChild(r);
            }
        }

        function initKeyboard() {
            const rows = [['Й','Ц','У','К','Е','Н','Г','Ш','Щ','З','Х','Ъ'],['Ф','Ы','В','А','П','Р','О','Л','Д','Ж','Э'],['ENTER','Я','Ч','С','М','И','Т','Ь','Б','Ю','DEL']];
            const kb = document.getElementById('keyboard'); kb.innerHTML = '';
            rows.forEach(row => {
                const r = document.createElement('div'); r.className = 'k-row';
                row.forEach(k => {
                    const b = document.createElement('button'); b.className = 'key';
                    if(k === 'ENTER') { b.innerHTML = '↵'; b.classList.add('wide'); b.onclick = () => handleInput({key: 'Enter'}); }
                    else if(k === 'DEL') { b.innerHTML = '⌫'; b.classList.add('wide'); b.onclick = () => handleInput({key: 'Backspace'}); }
                    else { b.innerText = k; b.id = 'key-'+k; b.onclick = () => handleInput({key: k}); }
                    r.appendChild(b);
                });
                kb.appendChild(r);
            });
        }

        // --- ЛОГИКА ВВОДА И СЛОВАРЯ ---
        function handleInput(e) {
            if(!gameActive) return;
            const k = e.key.toUpperCase();
            
            if(k === 'ENTER' || k === 'BACKSPACE' || (k.length === 1 && /[А-ЯЁ]/.test(k))) {
                if(k === 'ENTER') {
                    if(curTile < 5) return;
                    let word = "";
                    for(let i=0; i<5; i++) word += document.getElementById(`t-${curRow}-${i}`).innerText;
                    
                    // ПРОВЕРКА ПО СЛОВАРЮ
                    if(!DICTIONARY.includes(word)) {
                        showToast("Слова нет в словаре!");
                        return; // Блокируем отправку
                    }
                    
                    if(myRole === 'master') {
                        socket.emit('setSecretWord', { code: curRoom, word: word });
                        gameActive = false;
                        document.getElementById('game-status').innerText = "СЛОВО ОТПРАВЛЕНО!";
                        initBoard('board', 't'); curRow = 0; curTile = 0;
                    } else {
                        if(curRoom) {
                            socket.emit('submitGuess', { code: curRoom, guess: word });
                            gameActive = false;
                        } else {
                            checkLocal(word);
                        }
                    }
                } else if(k === 'BACKSPACE') {
                    if(curTile > 0) { curTile--; document.getElementById(`t-${curRow}-${curTile}`).innerText = ""; }
                } else if(curTile < 5) {
                    document.getElementById(`t-${curRow}-${curTile}`).innerText = k;
                    curTile++;
                }
            }
        }

        socket.on('wordIsReady', (d) => {
            if(myRole === 'guesser') {
                secretWord = d.word; gameActive = true;
                document.getElementById('game-status').innerText = "ОТГАДЫВАЙТЕ!";
            }
        });

        socket.on('guessResult', d => {
            d.states.forEach((s, i) => {
                const t = document.getElementById(`t-${curRow}-${i}`);
                t.classList.add(s);
                if (d.guess) t.innerText = d.guess[i]; 
                if(myRole === 'guesser') updateKeyColor(d.guess[i], s);
            });
            if(d.isWin || curRow >= 5) end(d.isWin);
            else { curRow++; curTile = 0; if(myRole === 'guesser') gameActive = true; }
        });

        // --- ЛОКАЛЬНАЯ ИГРА И БОТ ---
        function checkLocal(g) {
            const states = Array(5).fill('absent');
            const sArr = secretWord.split('');
            g.split('').forEach((c, i) => { if(c === sArr[i]) { states[i] = 'correct'; sArr[i] = null; } });
            g.split('').forEach((c, i) => { if(states[i] !== 'correct' && sArr.includes(c)) { states[i] = 'present'; sArr[sArr.indexOf(c)] = null; } });
            
            states.forEach((s, i) => { 
                document.getElementById(`t-${curRow}-${i}`).classList.add(s); 
                updateKeyColor(g[i], s); 
            });
            
            if(g === secretWord) end(true);
            else if(curRow >= 5) end(false);
            else { curRow++; curTile = 0; gameActive = true; }
        }

        function botTurn() {
            if(!gameActive) return clearInterval(botInterval);
            
            // Бот выбирает случайное слово из отфильтрованного списка
            let guess = botWords[Math.floor(Math.random() * botWords.length)] || secretWord;
            
            const states = Array(5).fill('absent');
            const sArr = secretWord.split('');
            guess.split('').forEach((c, i) => { if(c === sArr[i]) { states[i] = 'correct'; sArr[i] = null; } });
            guess.split('').forEach((c, i) => { if(states[i] !== 'correct' && sArr.includes(c)) { states[i] = 'present'; sArr[sArr.indexOf(c)] = null; } });
            
            // Отрисовка на доске бота
            states.forEach((s, i) => {
                const bt = document.getElementById(`bt-${botRow}-${i}`);
                bt.classList.add(s);
                bt.innerText = guess[i];
            });

            if(guess === secretWord) {
                end(false, "БОТ ОПЕРЕДИЛ ТЕБЯ!");
            } else {
                botRow++;
                if(botRow >= 6) clearInterval(botInterval); // Бот не справился
                else filterBotWords(guess, states); // Бот "думает"
            }
        }

        // Логика фильтрации слов для бота
        function filterBotWords(guess, states) {
            botWords = botWords.filter(w => {
                let temp = w.split('');
                for(let i=0; i<5; i++) {
                    if(states[i] === 'correct') { if(temp[i] !== guess[i]) return false; temp[i] = null; }
                }
                for(let i=0; i<5; i++) {
                    if(states[i] === 'present') {
                        let idx = temp.indexOf(guess[i]);
                        if(idx === -1 || w[i] === guess[i]) return false; 
                        temp[idx] = null;
                    } else if(states[i] === 'absent') {
                        if(temp.includes(guess[i])) return false;
                    }
                }
                return true;
            });
        }

        function updateKeyColor(letter, state) {
            const btn = document.getElementById('key-' + letter);
            if(!btn) return;
            if(state === 'correct') btn.className = 'key correct';
            else if(state === 'present' && !btn.classList.contains('correct')) btn.className = 'key present';
            else if(state === 'absent' && !btn.classList.contains('correct') && !btn.classList.contains('present')) btn.className = 'key absent';
        }

        function end(win, customText) {
            gameActive = false;
            clearInterval(botInterval);
            
            let xpChange = 0;
            if(curRoom || botMode) {
                if(win) {
                    xpChange = curRoom ? 100 : 50; // За мультиплеер +100, за бота +50
                    document.getElementById('game-status').innerText = `ПОБЕДА! +${xpChange} XP`; 
                } else { 
                    xpChange = curRoom ? -50 : -25;
                    document.getElementById('game-status').innerText = customText || ("ПРОИГРЫШ. СЛОВО: " + secretWord); 
                }
                myXP += xpChange;
                if(myXP < 0) myXP = 0;
                updateUI();
            } else {
                document.getElementById('game-status').innerText = win ? "ПОБЕДА!" : "ПРОИГРЫШ. СЛОВО: " + secretWord;
            }
            document.getElementById('back-btn').style.display = 'block';
        }

        function show(id) { document.querySelectorAll('.screen').forEach(s => s.classList.remove('active')); document.getElementById(id).classList.add('active'); }
        
        window.addEventListener('keydown', (e) => {
            const activeInput = document.activeElement.tagName === 'INPUT';
            if(!activeInput) handleInput(e);
        });
    </script>
</body>
</html>
